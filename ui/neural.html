<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRIDAY — Neural Map</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        #neural-canvas{ position:absolute; inset:0; width:100%; height:100%; z-index:1; }
        .neural-header{ position:fixed; top:18px; left:18px; right:18px; z-index:10;
            display:flex; align-items:center; justify-content:space-between; padding:0 18px; height:54px; pointer-events:auto; }
        .neural-title{ font-weight:700; letter-spacing:.22em; font-size:15px; }
        .neural-title small{ color:var(--text-dim); font-weight:400; letter-spacing:.18em; margin-left:10px; font-size:10px; }
        .back-btn{ pointer-events:auto; }
        .neural-hint{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:10;
            font-size:11px; letter-spacing:.1em; color:var(--text-dim); }
        .neural-detail{ position:fixed; right:18px; top:84px; bottom:24px; width:340px; max-width:42vw; z-index:20;
            padding:18px; overflow-y:auto; transform:translateX(380px); opacity:0;
            transition:transform .35s cubic-bezier(.16,1,.3,1), opacity .3s; pointer-events:auto; }
        .neural-detail.open{ transform:translateX(0); opacity:1; }
        .neural-detail .nd-kind{ font-size:9px; letter-spacing:.2em; color:var(--accent); }
        .neural-detail .nd-title{ font-size:18px; font-weight:600; margin:6px 0 14px; word-break:break-word; }
        .neural-detail .nd-row{ font-size:12px; color:rgba(255,255,255,.75); line-height:1.6; margin-bottom:8px; word-break:break-word; }
        .neural-detail .nd-row b{ color:var(--accent); font-weight:600; letter-spacing:.04em; }
        .neural-detail .nd-close{ position:absolute; top:12px; right:14px; }
        .neural-detail pre{ white-space:pre-wrap; font-size:11px; color:rgba(255,255,255,.7);
            background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:8px; padding:10px; }
    </style>
    <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.174.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.174.0/examples/jsm/"
    }}
    </script>
</head>
<body>
    <canvas id="neural-canvas"></canvas>
    <header class="glass-panel neural-header">
        <div class="neural-title">FRIDAY <small>NEURAL MAP</small></div>
        <a class="icon-btn back-btn" href="../" title="Back">&#8592; BACK</a>
    </header>
    <div class="neural-hint">Drag to orbit &middot; scroll to zoom &middot; click a node to inspect</div>
    <aside class="glass-panel neural-detail" id="neural-detail">
        <button class="icon-btn nd-close" id="nd-close" title="Close">&#10005;</button>
        <div class="nd-kind" id="nd-kind">NODE</div>
        <div class="nd-title" id="nd-title">—</div>
        <div id="nd-body"></div>
    </aside>
    <script type="module" src="js/neural.js"></script>
</body>
</html>
