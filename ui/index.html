<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday AI</title>
    <link rel="stylesheet" href="ui/css/style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.174.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.174.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <canvas id="orb-canvas"></canvas>
    <div id="neural-map-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; display: none;"></div>
    <div id="ui-layer">
        <header class="glass-panel main-header">
            <div class="wordmark">Friday<span class="dot"></span></div>
            <div class="header-actions">
                <button class="icon-btn" id="neural-map-btn" title="Neural Map">🧠</button>
                <button class="icon-btn" id="alerts-btn" title="Alerts">🔔<span class="badge"></span></button>
                <button class="icon-btn" id="settings-btn" title="Settings">⚙️</button>
                <div class="status-dot" id="status-dot"></div>
            </div>
        </header>

        <aside class="glass-panel activity-panel collapsed" id="activity-panel">
            <button class="panel-toggle" id="panel-toggle">◀</button>
            <div class="panel-content">
                <section>
                    <header>INBOX <span class="count">0</span></header>
                    <div class="entries" id="inbox-entries"></div>
                </section>
                <section>
                    <header>SCOUT TASKS <span class="count">0</span></header>
                    <div class="entries" id="scout-entries"></div>
                </section>
                <section>
                    <header>FLUX TASKS <span class="count">0</span></header>
                    <div class="entries" id="flux-entries"></div>
                </section>
                <section>
                    <header>RELAY DRAFTS <span class="count">0</span></header>
                    <div class="entries" id="relay-entries"></div>
                </section>

                <section class="vitals-section">
                    <header>SUIT INTEGRITY</header>
                    <div class="vital-item">
                        <span>CPU</span>
                        <div class="vital-track"><div id="cpu-bar" class="vital-fill" style="width: 0%"></div></div>
                    </div>
                    <div class="vital-item">
                        <span>RAM</span>
                        <div class="vital-track"><div id="ram-bar" class="vital-fill" style="width: 0%"></div></div>
                    </div>
                </section>
            </div>
        </aside>

        <div id="response-cards-container"></div>

        <div class="bottom-bar">
            <div class="mic-container">
                <button class="mic-btn" id="mic-trigger">
                    <svg class="mic-icon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.34 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                    <svg class="stop-icon" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                </button>
                <div class="hint-text">TAP OR "HEY FRIDAY"</div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="glass-panel modal-content">
            <h2>System Configuration</h2>
            <div class="settings-grid" id="settings-form">
                <!-- Dynamically populated -->
            </div>

            <h2 style="margin-top: 30px;">Security Permissions</h2>
            <div class="settings-grid" id="permissions-form">
                <!-- Dynamically populated -->
            </div>

            <div class="modal-actions">
                <button id="save-settings" class="action-btn">APPLY CHANGES</button>
                <button id="close-settings" class="action-btn secondary">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- Permission Approval Toast -->
    <div id="permission-toast" class="toast hidden">
        <div class="glass-panel toast-content">
            <p id="toast-message">Permission Request</p>
            <div class="toast-actions">
                <button id="toast-allow" class="action-btn">ALLOW</button>
                <button id="toast-deny" class="action-btn secondary">DENY</button>
            </div>
        </div>
    </div>
    <script type="module" src="ui/js/orb.js"></script>
    <script type="module" src="ui/js/app.js"></script>
</body>
</html>
